services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: logline
    ports:
      - "8080:8080"
    environment:
      PORT: ":8080"
      DB_URL: "postgres://logline:password@db:5432/loglinedb"

      REQLIMIT: "5"
      BURST: "10"

      VERSION: "v1.0.0"

      READ_TIMEOUT: "10s"
      READ_HEADER_TIMEOUT: "5s"
      WRITE_TIMEOUT: "15s"
      IDLE_TIMEOUT: "60s"

    depends_on:
      db:
        condition: service_healthy

    restart: unless-stopped

  db:
    image: postgres:18-alpine
    container_name: loglinedb
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: logline
      POSTGRES_PASSWORD: password
      POSTGRES_DB: loglinedb

    volumes:
      - pgdata:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logline -d loglinedb"]
      interval: 5s
      timeout: 5s
      retries: 5

    restart: unless-stopped

volumes:
  pgdata:
