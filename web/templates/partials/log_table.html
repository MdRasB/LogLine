{{define "log_table"}}

<section class="logs">

    <div class="section-header">

        <h2>Logs</h2>

    </div>

    <div class="table-card">

        <table class="logs-table">

            <thead>

                <tr>

                    <th>Timestamp</th>

                    <th>Level</th>

                    <th>Service</th>

                    <th>Message</th>

                </tr>

            </thead>

            <tbody>

                {{if .Logs}}

                    {{range .Logs}}

                    <tr>

                        <td>{{.Timestamp.Format "2006-01-02 15:04:05"}}</td>

                        <td>

                            <span class="log-level log-level-{{.Level}}">
                                {{.Level}}
                            </span>

                        </td>

                        <td>{{.Service}}</td>

                        <td>{{.Message}}</td>

                    </tr>

                    {{end}}

                {{else}}

                    <tr>

                        <td colspan="4" class="empty-table">

                            No logs matched the current filters.

                        </td>

                    </tr>

                {{end}}

            </tbody>

        </table>

    </div>

</section>

{{end}}
