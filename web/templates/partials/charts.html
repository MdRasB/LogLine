{{define "charts"}}

<section class="charts">

    <div class="chart-card">

        <h2>Hourly Log Volume</h2>

        <canvas id="volumeChart"></canvas>

    </div>

    <div class="chart-card">

        <h2>Logs by Level</h2>

        <canvas id="levelChart"></canvas>

    </div>

    <div class="chart-card chart-wide">

        <h2>Logs by Service</h2>

        <canvas id="serviceChart"></canvas>

    </div>

</section>

{{end}}
