{{define "filters"}}

<section class="filters">

    <div class="card">

        <form
            class="filter-form"
            action="/dashboard"
            method="GET">

            <div class="filter-group">

                <label for="service">
                    Service
                </label>

                <input
                    id="service"
                    name="service"
                    type="text"
                    placeholder="api"
                    value="{{.Filters.Service}}">

            </div>

            <div class="filter-group">

                <label for="level">
                    Level
                </label>

                <select
                    id="level"
                    name="level">

                    <option value=""
                        {{if eq .Filters.Level ""}}selected{{end}}>
                        All
                    </option>

                    <option value="debug"
                        {{if eq .Filters.Level "debug"}}selected{{end}}>
                        Debug
                    </option>

                    <option value="info"
                        {{if eq .Filters.Level "info"}}selected{{end}}>
                        Info
                    </option>

                    <option value="warn"
                        {{if eq .Filters.Level "warn"}}selected{{end}}>
                        Warn
                    </option>

                    <option value="error"
                        {{if eq .Filters.Level "error"}}selected{{end}}>
                        Error
                    </option>

                    <option value="fatal"
                        {{if eq .Filters.Level "fatal"}}selected{{end}}>
                        Fatal
                    </option>

                </select>

            </div>

            <div class="filter-group">

                <label for="search">
                    Search
                </label>

                <input
                    id="search"
                    name="search"
                    type="text"
                    placeholder="Search message..."
                    value="{{.Filters.Search}}">

            </div>

            <div class="filter-actions">

                <button
                    class="btn btn-primary"
                    type="submit">

                    Apply Filters

                </button>

                <a
                    class="btn btn-secondary"
                    href="/dashboard">

                    Reset

                </a>

            </div>

        </form>

    </div>

</section>

{{end}}
